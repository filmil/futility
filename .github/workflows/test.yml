# SPDX-License-Identifier: Apache-2.0

name: Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "43 7 * * 0"
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Checkout first: the bazelisk cache is keyed on .bazelversion.
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Build
        run: bazel build //...
      - name: Test
        run: bazel test //...
      # What a consumer of the module gets, and what the Bazel Central
      # Registry's presubmit runs: integration/ depends on futility the way a
      # registry user would.
      - name: Test the integration module
        run: cd integration && bazel test //...
