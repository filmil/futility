# SPDX-License-Identifier: Apache-2.0
#
# Publishes a release to filmil/bazel-registry, as a pull request there.
# Tag and Release calls this after the release; the dispatch is for
# publishing a release by hand, when the automatic publish did not happen.
# Based on the instructions at https://github.com/bazel-contrib/publish-to-bcr
name: "Publish to my Bazel registry"

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish"
        required: true
        type: string

jobs:
  publish:
    uses: "bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.0"
    with:
      tag_name: ${{ inputs.tag_name }}
      # This is the registry for which the PR will be open.
      registry: filmil/bazel-registry
      # This is the fork of `registry`. It can be the same repo.
      registry_fork: filmil/bazel-registry
      # This module is published only to filmil/bazel-registry, not to the
      # Bazel Central Registry, and filmil/bazel-registry does not verify
      # attestations.
      attest: false
      draft: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
